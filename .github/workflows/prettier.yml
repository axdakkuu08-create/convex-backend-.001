# Be sure to update .mergify.yml rules if adding/renaming any jobs.

name: Prettier
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: ["**", "!release"]

jobs:
  check:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - run: scripts/check_prettier_matches_dprint.py

      - name: Get dprint version
        run: |
          echo DPRINT_VERSION=$(node -p "require('./scripts/package.json').devDependencies['dprint']") >> $GITHUB_ENV

      - name: Format PR25 recovery targets with pinned dprint
        run: |
          curl -fsSL https://dprint.dev/install.sh | sh -s "$DPRINT_VERSION"
          ~/.dprint/bin/dprint fmt apps/pulse-music-workspace/app.js apps/pulse-music-workspace/index.html apps/pulse-music-workspace/playlist-manager.js apps/pulse-music-workspace/styles.css
          ~/.dprint/bin/dprint check apps/pulse-music-workspace/app.js apps/pulse-music-workspace/index.html apps/pulse-music-workspace/playlist-manager.js apps/pulse-music-workspace/styles.css

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr25-dprint-formatted
          path: |
            apps/pulse-music-workspace/app.js
            apps/pulse-music-workspace/index.html
            apps/pulse-music-workspace/playlist-manager.js
            apps/pulse-music-workspace/styles.css

      - uses: dprint/check@9cb3a2b17a8e606d37aae341e49df3654933fc23 # v2.3
        with:
          dprint-version: ${{ env.DPRINT_VERSION }}
