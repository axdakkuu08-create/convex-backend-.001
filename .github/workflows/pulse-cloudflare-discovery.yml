name: Pulse Cloudflare Discovery Gateway
on:
  pull_request:
    paths:
      - "cloudflare/pulse-discovery-gateway/**"
      - "apps/pulse-music-workspace/catalog-search.js"
      - "apps/pulse-music-workspace/internet-archive.js"
      - "apps/pulse-music-workspace/tests/integrations.test.cjs"
  push:
    branches:
      - "feature/pulse-cloudflare-discovery-gateway"
    paths:
      - "cloudflare/pulse-discovery-gateway/**"
      - "apps/pulse-music-workspace/**"
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test discovery Worker
        working-directory: cloudflare/pulse-discovery-gateway
        run: npm test
      - name: Syntax-check Pulse browser integrations
        run: |
          node --check apps/pulse-music-workspace/catalog-search.js
          node --check apps/pulse-music-workspace/internet-archive.js
          node --check apps/pulse-music-workspace/playlist-store.js
