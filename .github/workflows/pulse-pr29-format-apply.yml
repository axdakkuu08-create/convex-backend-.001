name: Pulse PR29 one-time formatting import
on:
  push:
    branches:
      - feature/pulse-mobile-discovery-preferences
    paths:
      - .github/workflows/pulse-pr29-format-apply.yml
permissions:
  contents: write
jobs:
  apply-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pulse-mobile-discovery-preferences
      - name: Download and verify formatted source archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3L09RXa2BZQPAMMw9tODuB3CKSK/def63115-9b47-4b01-85e7-dfb38fcacaef.zip' -o "$RUNNER_TEMP/pulse-pr29.zip"
          mkdir -p "$RUNNER_TEMP/pulse-pr29"
          unzip -q "$RUNNER_TEMP/pulse-pr29.zip" -d "$RUNNER_TEMP/pulse-pr29"
          cd "$RUNNER_TEMP/pulse-pr29"
          cat > SHA256SUMS <<'EOF'
          a726cadfb67e28ddc3c7daeced8d4da1a96505718c1b2228e7434cbadcd1501d  apps/pulse-music-workspace/app.js
          63430d1595bc815dfd96e3c4068d36c05d5005512d967026717e8d858da34c6e  apps/pulse-music-workspace/styles.css
          c825c96735a04c457dbeadb2e787bc720a1aa0de22c3ee63e14d5aaf73578c85  apps/pulse-music-workspace/catalog-search.js
          16e79d58abcf96405feb1a8f229d04e97338e61d8e69447542addee59b10095c  apps/pulse-music-workspace/internet-archive.js
          076d918f7d7d1379f5bd903579b3bb0155c438a2f74a29d98c543f2fa68ab2ba  apps/pulse-music-workspace/home-refresh.js
          3fd06df32247e24e8ee111f27fc5a56e684064e4037881123d2ad0e9671b51fa  apps/pulse-music-workspace/home-refresh.css
          7f3bc271d0e5ad762debffd0270269511a921e745efb7d21285a3504d63a1f1c  apps/pulse-music-workspace/cloud-sync.js
          554a180f89826acb23b3a9e1e0710a153317292591a01f5e9d25b84aff02fa63  apps/pulse-music-workspace/playlist-store.js
          c212a8c7188b9aa74053fa253e9a9564422d3246424a3d369862e88d94846285  apps/pulse-music-workspace/index.html
          f2328001f6c082ec75e2df757b71a02de16aeb5712aa8bf464fd9aee48da3d17  apps/pulse-music-workspace/tests/integrations.test.cjs
          EOF
          sha256sum --check SHA256SUMS
      - name: Apply the ten verified files
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/pulse-pr29/apps/pulse-music-workspace/." apps/pulse-music-workspace/
          git diff --check
          npx --yes dprint@0.57.0 check
          for f in apps/pulse-music-workspace/app.js apps/pulse-music-workspace/cloud-sync.js apps/pulse-music-workspace/catalog-search.js apps/pulse-music-workspace/home-refresh.js apps/pulse-music-workspace/playlist-store.js apps/pulse-music-workspace/internet-archive.js; do node --check "$f"; done
          node --test apps/pulse-music-workspace/tests/integrations.test.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pulse-music-workspace/app.js apps/pulse-music-workspace/styles.css apps/pulse-music-workspace/catalog-search.js apps/pulse-music-workspace/internet-archive.js apps/pulse-music-workspace/home-refresh.js apps/pulse-music-workspace/home-refresh.css apps/pulse-music-workspace/cloud-sync.js apps/pulse-music-workspace/playlist-store.js apps/pulse-music-workspace/index.html apps/pulse-music-workspace/tests/integrations.test.cjs
          if git diff --cached --quiet; then
            echo "No formatted file changes to commit."
          else
            git commit -m "Format Pulse sources with dprint 0.57.0"
            git push origin HEAD:feature/pulse-mobile-discovery-preferences
          fi
