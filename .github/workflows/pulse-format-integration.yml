name: Format Pulse integration branch

on:
  push:
    branches:
      - integration/pulse-main-pr25-28-preserve-pr29
    paths:
      - .github/workflows/pulse-format-integration.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/pulse-main-pr25-28-preserve-pr29
          fetch-depth: 0
      - name: Install dprint
        run: |
          curl -fsSL https://dprint.dev/install.sh | sh
          echo "$HOME/.dprint/bin" >> "$GITHUB_PATH"
      - name: Format integration files
        run: |
          dprint fmt \
            apps/pulse-music-workspace/app.js \
            apps/pulse-music-workspace/catalog-search.js \
            apps/pulse-music-workspace/home-archive-discovery.js \
            apps/pulse-music-workspace/home-refresh.css \
            apps/pulse-music-workspace/home-refresh.js \
            apps/pulse-music-workspace/index.html \
            apps/pulse-music-workspace/playlist-store.js \
            apps/pulse-music-workspace/tests/integrations.test.cjs
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pulse-music-workspace
          git commit -m "style(pulse): format integration branch"
          git push origin HEAD:integration/pulse-main-pr25-28-preserve-pr29
