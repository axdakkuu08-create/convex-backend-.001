name: Pulse Workspace Tests

on:
  pull_request:
    paths:
      - "apps/pulse-music-workspace/**"
      - ".github/workflows/pulse-workspace-tests.yml"
  push:
    branches:
      - feat/pulse-glass-charts-archive-mix
      - integration/pulse-pr33-37-consolidated
      - fix/pulse-b01-b17-core-storage
    paths:
      - "apps/pulse-music-workspace/**"
      - ".github/workflows/pulse-workspace-tests.yml"

permissions:
  contents: read

jobs:
  pulse-workspace-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check Pulse workspace modules
        run: |
          node --check apps/pulse-music-workspace/app.js
          node --check apps/pulse-music-workspace/queue-storage.js
          node --check apps/pulse-music-workspace/playlist-playback.js
          node --check apps/pulse-music-workspace/playlist-store.js
          node --check apps/pulse-music-workspace/home-refresh.js
          node --check apps/pulse-music-workspace/home-archive-discovery.js
          node --check apps/pulse-music-workspace/charts-dashboard.js
          node --check apps/pulse-music-workspace/song-recognition.js
          node --check apps/pulse-music-workspace/tempus-player.js
          node --check apps/pulse-music-workspace/api/apple-charts.js
          node --check apps/pulse-music-workspace/api/pulse-config.js
      - name: Run Pulse integration tests
        run: node --test apps/pulse-music-workspace/tests/*.test.cjs
