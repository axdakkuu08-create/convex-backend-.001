name: Pulse Workspace Tests

on:
  pull_request:
    paths:
      - "apps/pulse-music-workspace/**"
      - ".github/workflows/pulse-workspace-tests.yml"
  push:
    branches:
      - feat/pulse-glass-charts-archive-mix
      - integration/pulse-pr33-37-consolidated
      - fix/pulse-b01-b17-core-storage
      - checkpoint/pulse-stage4-7-2026-11-19
    paths:
      - "apps/pulse-music-workspace/**"
      - ".github/workflows/pulse-workspace-tests.yml"

permissions:
  contents: read

jobs:
  pulse-workspace-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check Pulse workspace modules
        run: |
          node --check apps/pulse-music-workspace/app.js
          node --check apps/pulse-music-workspace/media3-bridge.js
          node --check apps/pulse-music-workspace/queue-storage.js
          node --check apps/pulse-music-workspace/playlist-playback.js
          node --check apps/pulse-music-workspace/playlist-store.js
          node --check apps/pulse-music-workspace/home-refresh.js
          node --check apps/pulse-music-workspace/home-archive-discovery.js
          node --check apps/pulse-music-workspace/charts-dashboard.js
          node --check apps/pulse-music-workspace/song-recognition.js
          node --check apps/pulse-music-workspace/tempus-player.js
          node --check apps/pulse-music-workspace/api/apple-charts.js
          node --check apps/pulse-music-workspace/api/pulse-config.js
      - name: Run Pulse integration tests
        run: node --test apps/pulse-music-workspace/tests/*.test.cjs

  android-build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pulse-music-workspace
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
      - name: Validate Android source
        run: |
          node --check app.js
          node --check media3-bridge.js
          node --check scripts/prepare-web.mjs
          node --check scripts/install-native-android.mjs
          node --check scripts/write-android-config.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8'))"
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare bundled web assets
        run: npm run build:web
      - name: Write public Android cloud configuration
        env:
          PULSE_CONVEX_URL: ${{ vars.PULSE_CONVEX_URL }}
          PULSE_CLERK_PUBLISHABLE_KEY: ${{ vars.PULSE_CLERK_PUBLISHABLE_KEY }}
        run: node scripts/write-android-config.mjs
      - name: Generate Android project
        run: npx cap add android
      - name: Install native Media3 integration
        run: node scripts/install-native-android.mjs
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: apps/pulse-music-workspace/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-android-debug-apk
          path: apps/pulse-music-workspace/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
