name: One-time Pulse integration formatter

on:
  push:
    branches:
      - integration/pulse-pr33-37-consolidated

permissions:
  contents: write

jobs:
  format-pulse:
    if: github.ref_name == 'integration/pulse-pr33-37-consolidated'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repository dprint formatting to Pulse files
        run: npx --yes --package=dprint@0.57.0 -- dprint fmt apps/pulse-music-workspace/app.js apps/pulse-music-workspace/home-refresh.js apps/pulse-music-workspace/tempus-player.js apps/pulse-music-workspace/song-recognition.js apps/pulse-music-workspace/README.md apps/pulse-music-workspace/playlist-playback.js apps/pulse-music-workspace/playlist-store.js apps/pulse-music-workspace/tests/integrations.test.cjs apps/pulse-music-workspace/tempus-redesign.css
      - name: Commit formatting changes only
        run: |
          if git diff --quiet; then
            echo "Pulse files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/pulse-music-workspace/app.js apps/pulse-music-workspace/home-refresh.js apps/pulse-music-workspace/tempus-player.js apps/pulse-music-workspace/song-recognition.js apps/pulse-music-workspace/README.md apps/pulse-music-workspace/playlist-playback.js apps/pulse-music-workspace/playlist-store.js apps/pulse-music-workspace/tests/integrations.test.cjs apps/pulse-music-workspace/tempus-redesign.css
          git commit -m "style(pulse): apply dprint formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
