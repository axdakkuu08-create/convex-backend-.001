name: Format Pulse playlist feature branch
on:
  push:
    branches: [feature/pulse-archive-playlists]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Format Pulse workspace
        run: npx --yes dprint@0.57.0 fmt apps/pulse-music-workspace
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Pulse workspace already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pulse-music-workspace
          git commit -m "Format Pulse playlist changes"
          git push
