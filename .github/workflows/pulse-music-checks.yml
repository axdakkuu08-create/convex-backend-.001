name: Pulse music workspace checks

on:
  push:
    branches: [convex-inspired-app, feature/pulse-dev-clerk-convex-config]
    paths:
      - "apps/pulse-music-workspace/**"
      - ".github/workflows/pulse-music-checks.yml"
  pull_request:
    branches: [main, Main, feature/pulse-dev-clerk-convex-config]
    paths:
      - "apps/pulse-music-workspace/**"
      - ".github/workflows/pulse-music-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check apps/pulse-music-workspace/app.js
      - name: Check cloud integration module syntax
        run: node --check apps/pulse-music-workspace/cloud-sync.js
      - name: Test music provider URL integrations
        run: node --test apps/pulse-music-workspace/tests/integrations.test.cjs
      - name: Validate required interface elements
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html = Path('apps/pulse-music-workspace/index.html').read_text(encoding='utf-8')
          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.add(attrs['id'])
          parser = IDs()
          parser.feed(html)
          required = {'sourceForm', 'sourceUrl', 'sourceFrame', 'sourceError',
                      'embedWrap', 'closeEmbed', 'jamendoForm', 'jamendoQuery',
                      'jamendoStatus', 'jamendoResults', 'audioFileInput', 'addFileButton',
                      'addUrlButton', 'audio', 'play', 'rows'}
          missing = required - parser.ids
          if missing:
              raise SystemExit('Missing interface IDs: ' + ', '.join(sorted(missing)))
          if '<script src="app.js"></script>' not in html:
              raise SystemExit('app.js is not included')
          print('HTML interface smoke check passed')
          PY
