name: Pulse music workspace checks

on:
  push:
    branches: [convex-inspired-app]
    paths:
      - 'apps/pulse-music-workspace/**'
      - '.github/workflows/pulse-music-checks.yml'
  pull_request:
    branches: [main, Main]
    paths:
      - 'apps/pulse-music-workspace/**'
      - '.github/workflows/pulse-music-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pulse-music-workspace
    env:
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL || 'https://resolute-otter-348.convex.cloud' }}
      CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: npm install
      - name: Generate Convex types and typecheck backend
        if: ${{ env.CONVEX_DEPLOYMENT != '' }}
        run: npm run typecheck
      - name: Explain skipped deployment typecheck
        if: ${{ env.CONVEX_DEPLOYMENT == '' }}
        run: echo "Skipping Convex codegen/typecheck until a development deployment is configured. Frontend and source smoke tests will still run."
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Test music provider integrations and Convex backend safeguards
        run: npm test
      - name: Build production frontend
        run: npm run build
      - name: Validate required interface elements
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.add(attrs['id'])
          parser = IDs()
          parser.feed(html)
          required = {'sourceForm', 'sourceUrl', 'sourceFrame', 'sourceError',
                      'embedWrap', 'closeEmbed', 'audioFileInput', 'addFileButton',
                      'addUrlButton', 'audio', 'play', 'rows'}
          missing = required - parser.ids
          if missing:
              raise SystemExit('Missing interface IDs: ' + ', '.join(sorted(missing)))
          if '<script src="app.js"></script>' not in html:
              raise SystemExit('app.js is not included')
          print('HTML interface smoke check passed')
          PY
