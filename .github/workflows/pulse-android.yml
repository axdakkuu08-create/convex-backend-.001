name: Pulse Android build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "apps/pulse-music-workspace/**"
      - ".github/workflows/pulse-android.yml"

permissions:
  contents: read

jobs:
  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pulse-music-workspace
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apps/pulse-music-workspace/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-android-debug-apk
          path: apps/pulse-music-workspace/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release APK and Play Store AAB when signing is configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::notice::Release APK/AAB skipped. Configure the four Android signing secrets when an authorized release keystore is ready."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/pulse-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          npx cap build android --androidreleasetype APK --keystorepath "$KEYSTORE_PATH" --keystorepass "$ANDROID_KEYSTORE_PASSWORD" --keystorealias "$ANDROID_KEY_ALIAS" --keystorealiaspass "$ANDROID_KEY_PASSWORD"
          npx cap build android --androidreleasetype AAB --keystorepath "$KEYSTORE_PATH" --keystorepass "$ANDROID_KEYSTORE_PASSWORD" --keystorealias "$ANDROID_KEY_ALIAS" --keystorealiaspass "$ANDROID_KEY_PASSWORD"
          rm -f "$KEYSTORE_PATH"

      - name: Upload signed release APK and AAB
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pulse-android-release-artifacts
          path: |
            apps/pulse-music-workspace/android/app/build/outputs/apk/release/*.apk
            apps/pulse-music-workspace/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30
