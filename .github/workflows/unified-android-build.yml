name: Unified Music Android Build

on:
  push:
    branches:
      - feat/unified-music-platform-foundation-2026-11-24
    paths:
      - "apps/unified-music-platform/android/**"
      - ".github/workflows/unified-android-build.yml"

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug APK
        run: gradle --no-daemon -p apps/unified-music-platform/android :app:assembleDebug
