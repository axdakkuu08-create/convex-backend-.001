name: Temporary Pulse formatter repair
on:
  push:
    branches: [feature/pulse-convx-glass-adaptation]
    paths: [.github/workflows/pulse-format-fix.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install repository-pinned dprint
        run: |
          VERSION=$(node -p "require('./scripts/package.json').devDependencies['dprint']")
          curl -fsSL https://dprint.dev/install.sh | sh -s "$VERSION"
      - name: Format Pulse files and commit formatter output
        run: |
          ~/.dprint/bin/dprint fmt
          git add apps/pulse-music-workspace
          if git diff --cached --quiet; then
            echo "No formatter changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format Pulse discovery documentation and runtime tests"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
