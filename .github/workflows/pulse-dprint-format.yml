name: Pulse PR34 dprint formatter
on:
  push:
    branches:
      - feature/pulse-cloudflare-discovery-gateway
    paths:
      - "cloudflare/pulse-discovery-gateway/**"
      - "apps/pulse-music-workspace/**"
      - ".github/workflows/pulse-dprint-format.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pulse-cloudflare-discovery-gateway
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repository dprint formatter
        run: npx --yes dprint@0.57.0 fmt --incremental=false
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style(pulse): apply repository dprint formatting"
            git push origin HEAD:feature/pulse-cloudflare-discovery-gateway
          fi
